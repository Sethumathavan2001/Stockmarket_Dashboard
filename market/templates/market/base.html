<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Market Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Static CSS -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="logo">📈 Market Dashboard</div>
    <nav class="nav-links">
      <a href="{% url 'market:home' %}">Home</a>
      <a href="{% url 'market:daily_data' %}">Daily Data</a>
      <a href="{% url 'market:five_min' %}">5 Minutes</a>
      <a href="{% url 'market:live' %}">Live</a>
      <a href="{% url 'market:analysis' %}">Analysis</a>
      <a href="{% url 'market:daily_data_page' %}">Daily Data Scraper</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="footer">
    © 2026 Market Dashboard • Built with Django
  </footer>

</body>
</html>
