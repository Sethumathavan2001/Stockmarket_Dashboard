<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel One Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-800:#123B7A; --blue-600:#2F6FED; --bg:#FFFFFF; --panel:#F7F9FC; --border:#E3E8F0; --text:#101828;
    --text-muted:#64748B; --green:#0EA968; --green-bg:#E7F8F0; --red:#E5484D; --red-bg:#FDECEC; --yellow-bg:#FEF9E7;
    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .mono{ font-family:'JetBrains Mono',monospace; }
  .wrap{ max-width:1280px; margin:20px auto 48px; padding:0 24px; display:flex; flex-direction:column; gap:14px; }
  .wrap > *{ min-width:0; }
  .page-head{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; font-size:18px; font-weight:700; }
  .page-head .tag{ font-size:12.5px; font-weight:500; color:var(--text-muted); border-left:1px solid var(--border); padding-left:12px; }

  .bar{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;
    display:flex; flex-wrap:wrap; align-items:end; gap:14px 18px; }
  .field{ display:flex; flex-direction:column; gap:6px; flex:1 1 280px; max-width:420px; }
  .field label, .iv-label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
  .field input{ border:1px solid var(--border); border-radius:8px; padding:9px 12px; font:500 14px 'Inter',sans-serif; color:var(--text); background:#fff; width:100%; }
  .field input:focus{ outline:2px solid var(--blue-600); outline-offset:1px; }
  .iv-group{ display:flex; flex-direction:column; gap:6px; }
  .iv{ display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff; }
  .iv button{ border:0; border-right:1px solid var(--border); background:none; padding:9px 13px; font:600 13px 'Inter',sans-serif; color:var(--navy-800); cursor:pointer; }
  .iv button:last-child{ border-right:0; }
  .iv button:hover{ background:#EEF3FF; }
  .iv button.on{ background:var(--blue-600); color:#fff; }
  .iv button:focus-visible{ outline:2px solid var(--navy-800); outline-offset:-2px; }
  .status{ margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--text-muted); padding-bottom:9px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#94A3B8; flex-shrink:0; }
  .status.live{ color:var(--green); } .status.live .dot{ background:var(--green); animation:pulse 1.6s infinite; }
  .status.bad{ color:var(--red); } .status.bad .dot{ background:var(--red); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  @media (prefers-reduced-motion:reduce){ .status.live .dot{ animation:none; } }

  .quote{ border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 18px; display:flex; flex-wrap:wrap; align-items:center; gap:12px 28px; }
  .q-main{ display:flex; flex-direction:column; gap:2px; min-width:190px; }
  .q-name{ font-size:13px; font-weight:600; color:var(--text-muted); }
  .q-price{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; }
  .q-ltp{ font:700 26px 'JetBrains Mono',monospace; }
  .q-chg{ font:700 13px 'JetBrains Mono',monospace; padding:3px 8px; border-radius:999px; color:var(--text-muted); background:var(--panel); }
  .q-chg.up{ color:var(--green); background:var(--green-bg); } .q-chg.down{ color:var(--red); background:var(--red-bg); }
  .q-stats{ display:flex; flex-wrap:wrap; gap:10px 26px; }
  .q-stat span{ display:block; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); }
  .q-stat b{ font:600 13.5px 'JetBrains Mono',monospace; }

  .chart-card{ position:relative; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  #chart{ height:560px; width:100%; }
  .legend{ position:absolute; top:10px; left:14px; z-index:3; font:500 12px 'JetBrains Mono',monospace; color:#334155; pointer-events:none;
    background:rgba(255,255,255,.85); padding:3px 6px; border-radius:6px; }
  .legend b{ font-weight:700; } .legend .up{ color:var(--green); } .legend .down{ color:var(--red); }
  .empty{ position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center; background:#fff;
    text-align:center; color:var(--text-muted); font-size:14px; padding:24px; }
  .notice{ background:var(--yellow-bg); border:1px solid #F5E3A3; border-radius:8px; padding:9px 12px; font-size:13px; color:#854D0E; }
  .foot{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 16px; font-size:12px; color:var(--text-muted); }
  @media (max-width:640px){ .wrap{ padding:0 16px; } #chart{ height:420px; } .status{ margin-left:0; padding-bottom:0; } .iv button{ padding:9px 10px; } }
</style>
</head>
<body>

{% include 'market/_navbar.html' %}

<div class="wrap">
  <div class="page-head">Angel One Live <span class="tag">Live price and candles from Angel One</span></div>

  <div class="bar">
    <div class="field">
      <label for="stock">Stock</label>
      <input id="stock" list="stocks" placeholder="Search a stock, e.g. INFY" autocomplete="off" spellcheck="false">
      <datalist id="stocks">{% for c in companies %}<option value="{{ c.code }}">{{ c.name }}</option>{% endfor %}</datalist>
    </div>
    <div class="iv-group">
      <span class="iv-label">Candle</span>
      <div class="iv" id="intervals" role="group" aria-label="Candle size">{% for key, label in intervals %}<button type="button" data-iv="{{ key }}">{{ label }}</button>{% endfor %}</div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Choose a stock</span></div>
  </div>

  <div class="notice" id="notice" hidden></div>

  <div class="quote" id="quote" hidden>
    <div class="q-main">
      <div class="q-name" id="qName"></div>
      <div class="q-price"><span class="q-ltp" id="qLtp">—</span><span class="q-chg" id="qChg">—</span></div>
    </div>
    <div class="q-stats">
      <div class="q-stat"><span>Open</span><b id="qOpen">—</b></div>
      <div class="q-stat"><span>High</span><b id="qHigh">—</b></div>
      <div class="q-stat"><span>Low</span><b id="qLow">—</b></div>
      <div class="q-stat"><span>Prev close</span><b id="qPrev">—</b></div>
      <div class="q-stat"><span>Volume</span><b id="qVol">—</b></div>
      <div class="q-stat"><span>Avg price</span><b id="qAvg">—</b></div>
      <div class="q-stat"><span>Circuit</span><b id="qCircuit">—</b></div>
    </div>
  </div>

  <div class="chart-card">
    <div class="legend" id="legend" hidden></div>
    <div id="chart"></div>
    <div class="empty" id="empty">Search a stock above to see its live chart.</div>
  </div>

  <div class="foot"><span id="traded"></span><span id="source"></span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
'use strict';
const URLS = { candles: "{% url 'market:angel_live_candles' %}", quote: "{% url 'market:angel_live_quote' %}" };
const QUOTE_MS = 2000, CANDLE_MS = 10000, CLOSED_MS = 60000, RETRY_MS = 3000, VIEW_BARS = 130, OPEN_SEC = 33300;   // 09:15 in seconds
const UP = '#0EA968', DOWN = '#E5484D';
const $ = (id) => document.getElementById(id);
const nf = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (v) => v == null ? '—' : nf.format(v);
const vol = (v) => v == null ? '—' : v >= 1e7 ? (v / 1e7).toFixed(2) + ' Cr' : v >= 1e5 ? (v / 1e5).toFixed(2) + ' L' : v >= 1e3 ? (v / 1e3).toFixed(1) + ' K' : String(Math.round(v));
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; };

const names = new Map([...$('stocks').options].map((o) => [o.value, o.textContent]));
let CODE = '', IV = store('angelLive.interval') || 'ONE_MINUTE', SECONDS = 60;
let seq = 0, bars = [], dayVolume = null, prevLine = null, live = false, quoteTimer = null, candleTimer = null;

/* ---------------- chart ---------------- */
const el = $('chart');
const chart = LightweightCharts.createChart(el, {
  width: el.clientWidth, height: el.clientHeight,
  layout: { background: { color: '#fff' }, textColor: '#334155', fontFamily: 'Inter' },
  grid: { vertLines: { color: '#F1F5F9' }, horzLines: { color: '#F1F5F9' } },
  rightPriceScale: { borderColor: '#E3E8F0', scaleMargins: { top: .08, bottom: .24 } },
  timeScale: { borderColor: '#E3E8F0', timeVisible: true, secondsVisible: false, rightOffset: 6 },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal } });
const candles = chart.addCandlestickSeries({ upColor: UP, downColor: DOWN, borderVisible: false, wickUpColor: UP, wickDownColor: DOWN });
const volumes = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol', lastValueVisible: false, priceLineVisible: false });
chart.priceScale('vol').applyOptions({ scaleMargins: { top: .8, bottom: 0 } });
new ResizeObserver(() => chart.applyOptions({ width: el.clientWidth, height: el.clientHeight })).observe(el);

const volBar = (b) => ({ time: b.time, value: b.volume, color: b.close >= b.open ? 'rgba(14,169,104,.45)' : 'rgba(229,72,77,.45)' });

function legend(b) {
  const box = $('legend');
  if (!b) { box.hidden = true; return; }
  const cls = b.close >= b.open ? 'up' : 'down', move = b.open ? (b.close - b.open) / b.open * 100 : 0;
  box.hidden = false;
  box.innerHTML = `O <b>${num(b.open)}</b> H <b>${num(b.high)}</b> L <b>${num(b.low)}</b> C <b class="${cls}">${num(b.close)}</b> ` +
    `<span class="${cls}">${move >= 0 ? '+' : ''}${move.toFixed(2)}%</span> · Vol <b>${vol(b.volume)}</b>`;
}
chart.subscribeCrosshairMove((p) => {
  const hit = p.time != null ? bars.find((b) => b.time === p.time) : null;
  legend(hit || bars[bars.length - 1]);
});

/* ---------------- status ---------------- */
function setStatus(text, kind) {
  $('statusText').textContent = text;
  $('status').className = 'status' + (kind ? ' ' + kind : '');
}
function notice(text) { $('notice').hidden = !text; $('notice').textContent = text || ''; }

async function getJson(url) {
  const r = await fetch(url);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Angel One did not answer.');
  return d;
}

/* ---------------- candles ---------------- */
async function loadCandles(first, mine) {
  let failed = false;
  try {
    const d = await getJson(`${URLS.candles}?code=${encodeURIComponent(CODE)}&interval=${IV}`);
    if (mine !== seq) return;
    bars = d.candles;
    SECONDS = d.seconds;
    dayVolume = null;
    candles.setData(bars);
    volumes.setData(bars.map(volBar));
    $('source').textContent = `Data: Angel One, through ${d.account}'s login`;
    if (first) {
      $('empty').hidden = !!bars.length;
      if (!bars.length) { $('empty').style.display = 'flex'; $('empty').textContent = 'Angel One has no candles for this stock.'; }
      else $('empty').style.display = 'none';
      chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, bars.length - VIEW_BARS), to: bars.length + 6 });
    }
    legend(bars[bars.length - 1]);
    notice('');
  } catch (e) {
    if (mine !== seq) return;
    failed = true;
    notice(e.message);
    if (first && !bars.length) { $('empty').style.display = 'flex'; $('empty').textContent = 'No chart yet: ' + e.message; }
  }
  if (mine === seq) nextCandles(mine, first && failed, failed ? RETRY_MS : live ? CANDLE_MS : CLOSED_MS);
}
/* wait, and don't call Angel One while the tab is hidden */
function nextCandles(mine, first, ms) {
  clearTimeout(candleTimer);
  candleTimer = setTimeout(() => (document.hidden ? nextCandles(mine, first, CANDLE_MS) : loadCandles(first, mine)), ms);
}

/* the candle this trade time belongs to: Angel One's candles count from 09:15 */
function bucket(ts) {
  if (SECONDS >= 86400) return ts - ts % 86400;
  const day = ts - ts % 86400, sec = ts % 86400;
  return sec < OPEN_SEC ? null : day + OPEN_SEC + Math.floor((sec - OPEN_SEC) / SECONDS) * SECONDS;
}

/* move the forming candle with the latest price, until the next candle reload makes it exact */
function tick(q) {
  const last = bars[bars.length - 1];
  const delta = dayVolume != null && q.volume != null ? Math.max(0, q.volume - dayVolume) : 0;
  dayVolume = q.volume;
  if (!q.live || !last || q.ltp == null || q.ts == null) return;
  const time = bucket(q.ts);
  if (time == null || time < last.time) return;
  let bar = last;
  if (time > last.time) {
    bar = { time, open: q.ltp, high: q.ltp, low: q.ltp, close: q.ltp, volume: delta };
    bars.push(bar);
  } else {
    bar.high = Math.max(bar.high, q.ltp);
    bar.low = Math.min(bar.low, q.ltp);
    bar.close = q.ltp;
    bar.volume += delta;
  }
  candles.update(bar);
  volumes.update(volBar(bar));
  legend(bar);
}

/* ---------------- quote ---------------- */
function showQuote(q) {
  $('quote').hidden = false;
  $('qName').textContent = `${names.get(CODE) || CODE} · ${q.symbol}`;
  $('qLtp').textContent = num(q.ltp);
  const c = q.change ?? 0, cls = c > 0 ? 'up' : c < 0 ? 'down' : '';
  $('qChg').className = 'q-chg ' + cls;
  $('qChg').textContent = `${c > 0 ? '+' : ''}${num(q.change)} (${(q.pct ?? 0) > 0 ? '+' : ''}${(q.pct ?? 0).toFixed(2)}%)`;
  $('qOpen').textContent = num(q.open); $('qHigh').textContent = num(q.high); $('qLow').textContent = num(q.low);
  $('qPrev').textContent = num(q.prev_close); $('qVol').textContent = vol(q.volume); $('qAvg').textContent = num(q.avg);
  $('qCircuit').textContent = `${num(q.lower)} – ${num(q.upper)}`;
  $('traded').textContent = q.traded ? `Last trade ${q.traded} IST` : '';
  if (q.prev_close && IV !== 'ONE_DAY') {
    if (prevLine) candles.removePriceLine(prevLine);
    prevLine = candles.createPriceLine({ price: q.prev_close, color: '#64748B', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'Prev close' });
  }
  setStatus(q.live ? 'Live' : q.status, q.live ? 'live' : '');
}

async function loadQuote(mine) {
  if (!document.hidden) {
    try {
      const q = await getJson(`${URLS.quote}?code=${encodeURIComponent(CODE)}`);
      if (mine !== seq) return;
      live = q.live;
      showQuote(q);
      tick(q);
    } catch (e) {
      if (mine !== seq) return;
      setStatus('Not updating: ' + e.message, 'bad');
    }
  }
  if (mine === seq) quoteTimer = setTimeout(() => loadQuote(mine), live || document.hidden ? QUOTE_MS : CLOSED_MS);
}

/* ---------------- choosing ---------------- */
function start() {
  const mine = ++seq;
  clearTimeout(quoteTimer); clearTimeout(candleTimer);
  bars = []; dayVolume = null; live = true;           // until the first quote says otherwise
  if (prevLine) { candles.removePriceLine(prevLine); prevLine = null; }
  candles.setData([]); volumes.setData([]); legend(null);
  $('empty').style.display = 'flex'; $('empty').hidden = false; $('empty').textContent = 'Loading candles…';
  setStatus('Connecting…'); notice('');
  loadQuote(mine);
  loadCandles(true, mine);
}

function choose(code) {
  CODE = code;
  $('stock').value = code;
  store('angelLive.stock', code);
  history.replaceState(null, '', `?company=${encodeURIComponent(code)}`);
  start();
}

function pick() {
  const raw = $('stock').value.trim().toUpperCase();
  if (!raw) return;
  const code = names.has(raw) ? raw : names.has(raw + '.NS') ? raw + '.NS' : '';
  if (code) { if (code !== CODE) choose(code); }
  else notice(`${raw} is not in the stock list. Pick one from the suggestions.`);
}
$('stock').addEventListener('change', pick);
$('stock').addEventListener('keydown', (e) => { if (e.key === 'Enter') pick(); });
$('stock').addEventListener('focus', (e) => e.target.select());

function markInterval() {
  document.querySelectorAll('#intervals button').forEach((b) => {
    b.classList.toggle('on', b.dataset.iv === IV);
    b.setAttribute('aria-pressed', b.dataset.iv === IV);
  });
}
$('intervals').addEventListener('click', (e) => {
  const b = e.target.closest('[data-iv]');
  if (!b || b.dataset.iv === IV) return;
  IV = b.dataset.iv;
  store('angelLive.interval', IV);
  markInterval();
  if (CODE) start();
});

if (!document.querySelector(`#intervals [data-iv="${IV}"]`)) IV = 'ONE_MINUTE';
markInterval();
const opening = "{{ company|escapejs }}" || store('angelLive.stock');
if (opening && names.has(opening)) choose(opening);
})();
</script>
</body>
</html>
