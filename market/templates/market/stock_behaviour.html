<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Behaviour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0B2545; --navy-800:#123B7A; --blue-600:#2F6FED; --blue-50:#EEF3FF;
    --bg:#FFFFFF; --panel:#F7F9FC; --border:#E3E8F0; --text:#101828; --text-muted:#64748B;
    --green:#0EA968; --green-dark:#0A8A54; --green-bg:#E7F8F0; --red:#E5484D; --red-dark:#C93A3F; --red-bg:#FDECEC;
    --amber:#B45309; --amber-bg:#FEF3E0; --purple:#7C3AED; --purple-bg:#F3EEFF;
    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .mono{ font-family:'JetBrains Mono',monospace; }
  .wrap{ max-width:1440px; margin:0 auto; padding:0 24px 60px; }
  .page-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px; margin-top:20px; }
  .page-head .title{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; font-size:18px; font-weight:700; }
  .page-head .tag{ font-size:12.5px; font-weight:500; color:var(--text-muted); border-left:1px solid var(--border); padding-left:12px; }
  .head-r{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; font-size:12.5px; color:var(--text-muted); }
  .btn{ border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; color:#fff; background:var(--navy-800); white-space:nowrap; }
  .btn.ghost{ background:#fff; color:var(--navy-800); border:1px solid var(--border); font-weight:600; }
  .btn.sm{ padding:6px 10px; font-size:12.5px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .progress{ margin-top:12px; padding:10px 14px; border-radius:8px; background:var(--blue-50); color:var(--navy-800); font-size:13px; line-height:1.5; }
  .progress.err{ background:var(--red-bg); color:var(--red-dark); }
  .notice{ margin-top:12px; padding:10px 14px; border-radius:8px; font-size:13px; background:var(--amber-bg); color:var(--amber); line-height:1.5; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ border:1px solid var(--border); background:#fff; border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:600; color:var(--navy-800); cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
  .chip.on{ background:var(--navy-800); border-color:var(--navy-800); color:#fff; }
  .chip .fo{ width:6px; height:6px; border-radius:50%; background:var(--purple); }
  .filters{ border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); background:var(--panel); margin-top:14px; padding:12px 16px; display:grid; gap:10px; }
  .f-row{ display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; }
  .f-grp{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .f-lbl{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
  select, input[type=search]{ border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:13px; font-family:inherit; background:#fff; color:var(--text); }
  .said{ font-size:13.5px; line-height:1.5; }
  .said b{ font-weight:700; }
  .tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-top:14px; }
  .tile{ background:#fff; padding:10px 14px; }
  .tile .lbl{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
  .tile .v{ font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; margin-top:3px; }
  .tabs{ display:flex; flex-wrap:wrap; gap:2px; margin-top:16px; border-bottom:1px solid var(--border); }
  .tab{ border:none; background:none; padding:9px 14px; font-size:13.5px; font-weight:600; font-family:inherit; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.on{ color:var(--navy-800); border-bottom-color:var(--navy-800); }
  .grid{ display:grid; gap:14px; margin-top:14px; }
  .grid.two{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .grid.three{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .grid.five{ grid-template-columns:repeat(5,minmax(0,1fr)); }
  @media (max-width:1250px){ .grid.five{ grid-template-columns:repeat(3,minmax(0,1fr)); } .grid.three{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:860px){ .grid.two,.grid.three,.grid.five{ grid-template-columns:minmax(0,1fr); } }
  .card{ border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); background:#fff; min-width:0; }
  .card-head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 12px; padding:10px 14px; border-bottom:1px solid var(--border); }
  .card-title{ font-size:13px; font-weight:700; }
  .card-title.up{ color:var(--green-dark); } .card-title.down{ color:var(--red-dark); }
  .card-sub{ font-size:11.5px; color:var(--text-muted); }
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); padding:7px 8px; background:var(--panel); border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody td{ padding:5px 8px; border-bottom:1px solid #EEF2F7; white-space:nowrap; }
  td.num, th.num{ text-align:right; font-family:'JetBrains Mono',monospace; }
  tbody tr.click{ cursor:pointer; } tbody tr.click:hover td{ background:var(--blue-50); }
  td.sym{ font-weight:600; max-width:130px; overflow:hidden; text-overflow:ellipsis; }
  .up{ color:var(--green-dark); } .down{ color:var(--red-dark); } .muted{ color:var(--text-muted); }
  .steady{ color:var(--green-dark); font-weight:700; }
  td.cell{ cursor:pointer; text-align:right; font-family:'JetBrains Mono',monospace; }
  td.cell:hover{ outline:2px solid var(--blue-600); outline-offset:-2px; }
  td.cell.sel{ font-weight:700; box-shadow:inset 0 0 0 2px var(--navy-800); }
  td.link{ cursor:pointer; font-weight:600; color:var(--navy-800); }
  tr.on td{ background:var(--blue-50); }
  .note{ font-size:12px; color:var(--text-muted); line-height:1.6; padding:10px 14px 12px; }
  .empty{ padding:28px 14px; text-align:center; color:var(--text-muted); font-size:13px; line-height:1.6; }
  .check{ padding:7px 14px; font-size:11.5px; line-height:1.5; border-bottom:1px solid var(--border); color:var(--text-muted); }
  .rep{ display:inline-block; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; margin-right:4px; }
  .rep.good{ background:var(--green-bg); color:var(--green-dark); } .rep.fair{ background:var(--amber-bg); color:var(--amber); } .rep.poor{ background:var(--red-bg); color:var(--red-dark); }
  .seg{ display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button{ border:none; background:#fff; padding:5px 10px; font-size:12px; font-weight:600; font-family:inherit; color:var(--text-muted); cursor:pointer; }
  .seg button.on{ background:var(--navy-800); color:#fff; }
  .drawer{ position:fixed; top:0; right:0; bottom:0; width:min(620px,100vw); background:#fff; border-left:1px solid var(--border); box-shadow:-8px 0 24px rgba(16,24,40,.12); z-index:60; overflow-y:auto; }
  .drawer-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:#fff; z-index:1; }
  .drawer-head b{ font-size:16px; } .drawer-head small{ display:block; color:var(--text-muted); font-size:12px; margin-top:2px; }
  .drawer h3{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:16px 16px 6px; }
  .x{ border:none; background:none; font-size:22px; line-height:1; cursor:pointer; color:var(--text-muted); }
  @media (max-width:640px){ .wrap{ padding:0 16px 40px; } }
</style>
</head>
<body>

{% include 'market/_navbar.html' %}

<div class="wrap">
  <div class="page-head">
    <div class="title">Stock Behaviour <span class="tag" id="coverage">Loading</span></div>
    <div class="head-r">
      <input type="search" id="find" list="symbols" placeholder="Find a stock" aria-label="Find a stock">
      <datalist id="symbols"></datalist>
      <button class="btn ghost sm" id="reset" type="button">Clear filters</button>
      <button class="btn ghost sm" id="rebuild" type="button" title="Re-read the stored candles. Takes several minutes.">Rebuild data</button>
    </div>
  </div>
  <div class="progress" id="progress" hidden></div>

  <div id="main" hidden>
    <div class="filters">
      <div class="f-row">
        <div class="f-grp"><span class="f-lbl">Index</span><div class="chips" id="indexChips"></div></div>
      </div>
      <div class="f-row">
        <div class="f-grp"><span class="f-lbl">Index trend</span><div class="seg" id="trendSeg"></div></div>
        <div class="f-grp"><span class="f-lbl">Weekday</span><div class="seg" id="weekdaySeg"></div></div>
        <div class="f-grp"><span class="f-lbl">Expiry</span><div class="seg" id="expirySeg"></div></div>
        <div class="f-grp"><span class="f-lbl">Session</span><div class="seg" id="sessionSeg"></div></div>
      </div>
      <div class="f-row">
        <label class="f-grp"><span class="f-lbl">Sector</span><select id="sector"></select></label>
        <label class="f-grp"><span class="f-lbl">Period</span><select id="period">
          <option value="6m">6 months</option><option value="1y">1 year</option><option value="3y">3 years</option>
          <option value="5y">5 years</option><option value="all">Since 2016</option></select></label>
        <label class="f-grp"><span class="f-lbl">Daily turnover</span><select id="turnover">
          <option value="100">₹100 cr+</option><option value="25">₹25 cr+</option><option value="5">₹5 cr+</option><option value="0">All stocks</option></select></label>
        <label class="f-grp"><span class="f-lbl">Measure</span><select id="measure">
          <option value="o2c">Open to close</option><option value="c2c">Previous close to close</option></select></label>
        <label class="f-grp"><span class="f-lbl">Trend day means</span><select id="move">
          <option value="0">Default move</option><option value="0.1">0.1%+</option><option value="0.25">0.25%+</option>
          <option value="0.5">0.5%+</option><option value="1">1%+</option></select></label>
      </div>
      <div class="said" id="said"></div>
    </div>

    <div class="notice" id="shortNote" hidden></div>
    <div class="tiles" id="tiles"></div>

    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="panel"></div>
  </div>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Stock details"></aside>

<script>
const URLS = { meta: "{% url 'market:behaviour_meta' %}", data: "{% url 'market:behaviour_data' %}",
               stock: "{% url 'market:behaviour_stock' %}", build: "{% url 'market:behaviour_build' %}" };
const DEFAULTS = { index: 'NIFTY', trend: 'any', weekday: '-1', expiry: 'any', session: 'day', sector: '', period: '3y',
                   measure: 'o2c', turnover: '25', move: '0' };
const SEGS = {
  trend: [['any', 'Any'], ['up', 'Up'], ['down', 'Down']],
  weekday: [['-1', 'Any'], ['0', 'Mon'], ['1', 'Tue'], ['2', 'Wed'], ['3', 'Thu'], ['4', 'Fri']],
  expiry: [['any', 'Any'], ['all', 'Expiry'], ['weekly', 'Weekly'], ['monthly', 'Monthly'], ['none', 'Not expiry']],
  session: [['day', 'Whole day'], ['morning', 'Morning'], ['afternoon', 'Afternoon'], ['evening', 'Evening']],
};
const TABS = [['index', 'Index vs stocks'], ['volatility', 'Volatility'], ['weekday', 'Weekday'], ['sector', 'Sector'], ['expiry', 'Expiry']];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const csrf = () => { const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/); return m ? decodeURIComponent(m[1]) : ''; };
const pct = (v, d = 2) => v === null || v === undefined ? '-' : `${v > 0 ? '+' : ''}${Number(v).toFixed(d)}%`;
const plain = (v, d = 2) => v === null || v === undefined ? '-' : `${Number(v).toFixed(d)}%`;
const tone = v => v > 0 ? 'up' : v < 0 ? 'down' : 'muted';
const fmtDate = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';

const asked = new URLSearchParams(location.search).get('tab');
let filters = { ...DEFAULTS }, tab = TABS.some(t => t[0] === asked) ? asked : 'index', meta = null, data = null, volRank = 'biggest', openStock = null, seq = 0;
const query = extra => new URLSearchParams({ ...filters, ...extra }).toString();
const label = (name, value) => (SEGS[name].find(x => x[0] === String(value)) || [])[1];
const indexName = key => (meta.indices.find(i => i.key === key) || {}).name || key;
const hasExpiry = () => (meta.indices.find(i => i.key === filters.index) || {}).expiry;

function setFilter(changes) {
  Object.assign(filters, Object.fromEntries(Object.entries(changes).map(([k, v]) => [k, String(v)])));
  if (!hasExpiry()) filters.expiry = 'any';
  syncControls();
  load();
}

function syncControls() {
  $('indexChips').innerHTML = meta.indices.map(i => `<button type="button" class="chip ${i.key === filters.index ? 'on' : ''}" data-index="${esc(i.key)}" title="${esc(i.name)}${i.expiry ? ' - has expiries' : ''}">${i.expiry ? '<span class="fo"></span>' : ''}${esc(i.key)}</button>`).join('');
  for (const name of Object.keys(SEGS)) {
    $(name + 'Seg').innerHTML = SEGS[name].map(([v, t]) => {
      const off = name === 'expiry' && v !== 'any' && !hasExpiry();
      return `<button type="button" class="${String(filters[name]) === v ? 'on' : ''}" data-seg="${name}" data-value="${v}" ${off ? 'disabled title="This index has no expiries"' : ''}>${t}</button>`;
    }).join('');
  }
  for (const name of ['sector', 'period', 'measure', 'turnover', 'move']) $(name).value = filters[name];
  $('measure').disabled = filters.session !== 'day';
  $('said').innerHTML = sentence();
}

function sentence() {
  const bits = [`<b>${esc(filters.index)}</b>`];
  if (filters.trend !== 'any') bits.push(`trending <b>${filters.trend}</b>`);
  const when = [];
  if (filters.weekday !== '-1') when.push(`<b>${['Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays'][filters.weekday]}</b>`);
  if (filters.expiry !== 'any') when.push(`<b>${{ all: 'expiry days', weekly: 'weekly expiries', monthly: 'monthly expiries', none: 'non-expiry days' }[filters.expiry]}</b>`);
  if (filters.session !== 'day') when.push(`the <b>${filters.session}</b> session`);
  const who = filters.sector ? `<b>${esc(filters.sector)}</b> stocks` : 'all sectors';
  return `Showing ${who} against ${bits.join(' ')}${when.length ? ' on ' + when.join(', ') : ''}.`;
}

async function load() {
  const mine = ++seq;
  $('panel').innerHTML = '<div class="empty">Loading</div>';
  const r = await fetch(`${URLS.data}?${query()}`);
  const d = await r.json();
  if (mine !== seq) return;
  if (!r.ok) { $('panel').innerHTML = `<div class="empty">${esc(d.error || 'Could not load')}</div>`; return; }
  data = d;
  drawTiles();
  draw();
  if (openStock) showStock(openStock);
}

function drawTiles() {
  const s = data.summary;
  const short = filters.session !== 'day';
  $('shortNote').hidden = !short;
  if (short) $('shortNote').textContent = `Session filters use 5-minute candles, which are stored only from ${fmtDate(meta.session_first)} to ${fmtDate(meta.session_last)} (${meta.session_days} sessions), so the longer periods give the same result.`;
  const tiles = [['Matching days', s.days], ['Stocks included', s.stocks], [`${filters.index} average`, pct(s.index_avg)],
                 [`${filters.index} up on`, s.index_up_pct === null ? '-' : `${s.index_up_pct}% of days`],
                 ['Stock moves that were up', s.breadth === null ? '-' : `${s.breadth}%`], ['From', fmtDate(s.first)], ['To', fmtDate(s.last)]];
  $('tiles').innerHTML = tiles.map(([l, v]) => `<div class="tile"><div class="lbl">${esc(l)}</div><div class="v">${esc(v)}</div></div>`).join('');
}

function drawTabs() {
  $('tabs').innerHTML = TABS.map(([k, t]) => `<button type="button" role="tab" class="tab ${k === tab ? 'on' : ''}" data-tab="${k}" aria-selected="${k === tab}">${t}</button>`).join('');
}

function hitTable(rows) {
  if (!rows.length) return '<div class="empty">No stock qualifies. Widen the filters.</div>';
  return `<div class="table-wrap"><table><thead><tr><th>Stock</th><th class="num" title="Share of the matching days it moved this way">Hit</th><th class="num">Avg</th><th class="num">Days</th><th class="num" title="Hit rate in the older half, then the newer half of the days">Old / new</th></tr></thead><tbody>${rows.map(r => `
    <tr class="click" data-stock="${esc(r.code)}" title="${esc(r.name)} - ${esc(r.sector)}"><td class="sym">${esc(r.symbol)}</td><td class="num">${r.hit.toFixed(1)}%</td><td class="num ${tone(r.avg)}">${pct(r.avg)}</td><td class="num muted">${r.days}</td><td class="num ${r.steady ? 'steady' : 'muted'}">${r.older} / ${r.newer}</td></tr>`).join('')}</tbody></table></div>`;
}

// The live repeat test: the best stocks on the older half of the days, followed into the newer half.
function checkLine(c) {
  if (!c) return '<div class="check muted">Too few days to test if this repeats.</div>';
  const edge = c.newer - c.typical;
  const word = edge >= 5 ? ['good', 'Repeats'] : edge >= 2 ? ['fair', 'Repeats a little'] : ['poor', 'Does not repeat'];
  return `<div class="check" title="The ${c.stocks} best stocks on the older half of these days hit ${c.older}%. On the newer half they hit ${c.newer}%, and the typical stock hit ${c.typical}%."><span class="rep ${word[0]}">${word[1]}</span> top ${c.stocks} hit ${c.newer}% later, typical stock ${c.typical}%</div>`;
}

function againstNote(rows, word) {
  return rows.length && rows[0].hit < 50 ? `<div class="check muted">No stock ${word} on most of these days. These did so most often.</div>` : '';
}

function card(title, sub, body, cls = '') {
  return `<section class="card"><div class="card-head"><div class="card-title ${cls}">${title}</div><div class="card-sub">${sub}</div></div>${body}</section>`;
}

function drawIndexTab() {
  const q = data.quadrants, k = esc(filters.index);
  const limit = data.summary.threshold;
  return `<div class="grid two">
    ${card(`${k} up: stocks that went up`, `${q.up.days} days`, checkLine(q.up.check_up) + hitTable(q.up.stocks_up), 'up')}
    ${card(`${k} up: stocks that went down`, `${q.up.days} days`, checkLine(q.up.check_down) + againstNote(q.up.stocks_down, 'fell') + hitTable(q.up.stocks_down), 'down')}
    ${card(`${k} down: stocks that went up`, `${q.down.days} days`, checkLine(q.down.check_up) + againstNote(q.down.stocks_up, 'rose') + hitTable(q.down.stocks_up), 'up')}
    ${card(`${k} down: stocks that went down`, `${q.down.days} days`, checkLine(q.down.check_down) + hitTable(q.down.stocks_down), 'down')}
  </div><p class="note">An up day means the index moved ${limit}% or more, and a down day the same the other way; smaller days are left out. Lists are ranked by how sure the hit rate is, so a long record beats a short lucky one. Old / new in green means the stock did this in both halves of the days. The line above each list is a live test: the top stocks from the older days are followed into the newer days and compared with the typical stock.</p>`;
}

function drawVolatilityTab() {
  const v = data.volatility;
  if (!v.sessions.length) return '<div class="empty">Too few matching days with 5-minute candles. Widen the filters.</div>';
  const cards = v.sessions.map(s => {
    const rows = s[volRank];
    const body = `<div class="table-wrap"><table><thead><tr><th>Stock</th><th class="num" title="Average high-to-low range in this session">Range</th><th class="num" title="Average size of the move, either way">Move</th><th class="num" title="This session's share of the stock's range across the three sessions">Share</th><th class="num">Days</th></tr></thead><tbody>${rows.map(r => `
      <tr class="click" data-stock="${esc(r.code)}" title="${esc(r.name)} - ${esc(r.sector)}"><td class="sym">${esc(r.symbol)}</td><td class="num">${plain(r.range)}</td><td class="num">${plain(r.move)}</td><td class="num">${r.share}%</td><td class="num muted">${r.days}</td></tr>`).join('')}</tbody></table></div>`;
    return card(s.label, `${s.time}, typical stock ${plain(s.typical)}`, body);
  }).join('');
  return `<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center"><div class="seg" id="volSeg">
      <button type="button" class="${volRank === 'biggest' ? 'on' : ''}" data-vol="biggest">Biggest range</button>
      <button type="button" class="${volRank === 'peak' ? 'on' : ''}" data-vol="peak">Most active in this session only</button></div>
      <span class="muted" style="font-size:12.5px">${v.days} days with 5-minute candles</span></div>
    <div class="grid three">${cards}</div>`;
}

function drawWeekdayTab() {
  const rows = data.weekdays;
  const head = `<section class="card" style="margin-top:14px"><div class="table-wrap"><table><thead><tr><th>Day</th><th class="num">Days</th><th class="num">${esc(filters.index)} avg</th><th class="num">${esc(filters.index)} up on</th></tr></thead><tbody>${rows.map(r => `
    <tr class="click ${String(r.weekday) === filters.weekday ? 'on' : ''}" data-weekday="${r.weekday}"><td class="link">${r.label}</td><td class="num muted">${r.days}</td><td class="num ${tone(r.index_avg)}">${pct(r.index_avg)}</td><td class="num">${r.index_up_pct === null ? '-' : r.index_up_pct + '%'}</td></tr>`).join('')}</tbody></table></div></section>`;
  const small = list => !list.length ? '<div class="empty">None qualify</div>' : `<div class="table-wrap"><table><tbody>${list.map(r => `
    <tr class="click" data-stock="${esc(r.code)}" title="${esc(r.name)}: ${r.days} days, older half ${r.older}%, newer half ${r.newer}%"><td class="sym">${esc(r.symbol)}</td><td class="num ${r.steady ? 'steady' : ''}">${r.hit.toFixed(1)}%</td><td class="num ${tone(r.avg)}">${pct(r.avg)}</td></tr>`).join('')}</tbody></table></div>`;
  const cols = rows.map(r => `<div style="display:grid;gap:14px;align-content:start">
    ${card(`${r.label}: up`, `${r.days} days`, checkLine(r.check_up) + small(r.up), 'up')}${card(`${r.label}: down`, `${r.days} days`, checkLine(r.check_down) + small(r.down), 'down')}</div>`).join('');
  return `${head}<div class="grid five">${cols}</div><p class="note">Each stock shows its hit rate and average move on that weekday. A green hit rate means it held in both halves of the days.</p>`;
}

function heat(v) {
  if (v === null || v === undefined) return '';
  const a = Math.min(Math.abs(v) / 0.6, 1) * 0.55;
  return `background:rgba(${v > 0 ? '14,169,104' : '229,72,77'},${a.toFixed(2)})`;
}

function drawSectorTab() {
  const s = data.sectors;
  if (!s.rows.length) return '<div class="empty">No stocks at this turnover.</div>';
  const active = c => Object.keys(c.set).length && Object.entries(c.set).every(([k, v]) => String(filters[k]) === String(v));
  return `<section class="card" style="margin-top:14px"><div class="card-head"><div class="card-title">Average move by sector</div><div class="card-sub">Click a sector or any cell to apply it to the whole page</div></div>
    <div class="table-wrap"><table><thead><tr><th>Sector</th><th class="num">Stocks</th>${s.columns.map(c => `<th class="num">${esc(c.label)}</th>`).join('')}<th class="num" title="Average range in the morning session">Morn. range</th><th class="num">Aft. range</th><th class="num">Eve. range</th></tr></thead><tbody>${s.rows.map(r => `
      <tr class="${r.sector === filters.sector ? 'on' : ''}"><td class="link" data-sector="${esc(r.sector)}">${esc(r.sector)}</td><td class="num muted">${r.stocks}</td>${s.columns.map(c => {
        const x = r.cells[c.key];
        if (!x) return '<td class="num muted">-</td>';
        return `<td class="cell ${active(c) && r.sector === filters.sector ? 'sel' : ''}" style="${heat(x.avg)}" data-sector="${esc(r.sector)}" data-set='${esc(JSON.stringify(c.set))}' title="${x.up}% of ${x.days} days up">${pct(x.avg)}</td>`;
      }).join('')}<td class="num">${plain(r.range.morning)}</td><td class="num">${plain(r.range.afternoon)}</td><td class="num">${plain(r.range.evening)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">A sector's move is the plain average of its stocks at this turnover. Hover a cell for how often the sector rose.</p></section>`;
}

function drawExpiryTab() {
  const e = data.expiry;
  const pair = (a, b, f = plain) => `<td class="num">${f(a)}</td><td class="num muted">${f(b)}</td>`;
  const rows = e.indices.map(r => `<tr class="click ${r.index === filters.index ? 'on' : ''}" data-index="${esc(r.index)}">
    <td class="link">${esc(r.index)}</td><td class="num">${r.expiry.days}</td>
    <td class="num ${tone(r.expiry.avg)}">${pct(r.expiry.avg)}</td><td class="num muted">${pct(r.other.avg)}</td>
    ${pair(r.expiry.up, r.other.up, v => v === null ? '-' : v + '%')}
    ${pair(r.expiry.range, r.other.range)}
    ${pair(r.expiry.sessions.morning, r.other.sessions.morning)}
    ${pair(r.expiry.sessions.afternoon, r.other.sessions.afternoon)}
    ${pair(r.expiry.sessions.evening, r.other.sessions.evening)}
    <td class="up">${r.best ? esc(r.best.symbol) : '-'}</td><td class="down">${r.worst ? esc(r.worst.symbol) : '-'}</td></tr>`).join('');
  const table = `<section class="card" style="margin-top:14px"><div class="card-head"><div class="card-title">Every index: expiry days against other days</div><div class="card-sub">In each pair, dark is expiry and grey is other days. Click an index to select it.</div></div>
    <div class="table-wrap"><table><thead><tr><th>Index</th><th class="num">Expiries</th><th class="num" colspan="2">Avg move</th><th class="num" colspan="2">Up on</th><th class="num" colspan="2">Day range</th><th class="num" colspan="2">Morning</th><th class="num" colspan="2">Afternoon</th><th class="num" colspan="2">Evening</th><th>Top up</th><th>Top down</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  if (!e.has_expiry) return `${table}<div class="notice">${esc(filters.index)} has no options, so it has no expiry days. Pick an index with a purple dot.</div>`;
  const wide = !e.wider.length ? '<div class="empty">None qualify</div>' : `<div class="table-wrap"><table><thead><tr><th>Stock</th><th class="num">Expiry</th><th class="num">Normal</th><th class="num">Times</th><th class="num">Days</th></tr></thead><tbody>${e.wider.map(r => `
    <tr class="click" data-stock="${esc(r.code)}" title="${esc(r.name)} - ${esc(r.sector)}"><td class="sym">${esc(r.symbol)}</td><td class="num">${plain(r.range)}</td><td class="num muted">${plain(r.normal)}</td><td class="num">${r.ratio}x</td><td class="num muted">${r.days}</td></tr>`).join('')}</tbody></table></div>`;
  const k = esc(filters.index);
  return `${table}<div class="grid three">
    ${card(`Up on ${k} expiry`, `${e.days} days`, checkLine(e.check_up) + hitTable(e.up), 'up')}
    ${card(`Down on ${k} expiry`, `${e.days} days`, checkLine(e.check_down) + hitTable(e.down), 'down')}
    ${card('Range grows most on expiry', 'Against the same stock on other days', wide)}
  </div><p class="note">The lists follow the filters above, so choose Up, a weekday, a sector or a session to narrow them. For one expiry at a time, with 5-minute candles, use <a href="{% url 'market:index_analysis' %}">Index Analysis</a>.</p>`;
}

function draw() {
  drawTabs();
  $('panel').innerHTML = { index: drawIndexTab, volatility: drawVolatilityTab, weekday: drawWeekdayTab, sector: drawSectorTab, expiry: drawExpiryTab }[tab]();
}

async function showStock(code) {
  openStock = code;
  const mine = ++showStock.seq;
  const r = await fetch(`${URLS.stock}?${query({ code })}`);
  const d = await r.json();
  if (mine !== showStock.seq || openStock !== code) return;
  const box = $('drawer');
  box.hidden = false;
  if (!r.ok) { box.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const line = x => `<td class="num muted">${x.days}</td><td class="num">${x.up === null ? '-' : x.up + '%'}</td><td class="num ${tone(x.avg)}">${pct(x.avg)}</td><td class="num">${plain(x.range)}</td>`;
  const head = '<th class="num">Days</th><th class="num">Up on</th><th class="num">Avg</th><th class="num">Range</th>';
  const short = x => x ? `<td class="num">${x.up === null ? '-' : x.up + '%'}</td><td class="num ${tone(x.avg)}">${pct(x.avg)}</td>` : '<td class="num muted">-</td><td class="num muted">-</td>';
  box.innerHTML = `<div class="drawer-head"><div><b>${esc(d.stock.symbol)}</b><small>${esc(d.stock.name)} - ${esc(d.stock.sector)} - about ₹${d.stock.turnover ?? '-'} cr a day</small></div><button type="button" class="x" id="drawerClose" aria-label="Close">×</button></div>
    <div class="note">Under the filters on this page: ${$('said').textContent}</div>
    <h3>These days</h3><div class="table-wrap"><table><thead><tr><th></th>${head}</tr></thead><tbody><tr><td>Matching days</td>${line(d.these_days)}</tr></tbody></table></div>
    <h3>By weekday</h3><div class="table-wrap"><table><thead><tr><th>Day</th>${head}</tr></thead><tbody>${d.weekdays.map(w => `<tr><td>${w.label}</td>${line(w)}</tr>`).join('')}</tbody></table></div>
    <h3>By session</h3><div class="table-wrap"><table><thead><tr><th>Session</th>${head}</tr></thead><tbody>${d.sessions.map(w => `<tr><td>${w.label} <span class="muted">${w.time}</span></td>${line(w)}</tr>`).join('')}</tbody></table></div>
    <h3>Against every index</h3><div class="table-wrap"><table><thead><tr><th>Index</th><th class="num" colspan="2">Index up</th><th class="num" colspan="2">Index down</th><th class="num" colspan="2">Expiry</th></tr><tr><th></th><th class="num">Stock up on</th><th class="num">Avg</th><th class="num">Stock up on</th><th class="num">Avg</th><th class="num">Stock up on</th><th class="num">Avg</th></tr></thead><tbody>${d.indices.map(i => `<tr><td>${esc(i.index)}</td>${short(i.up)}${short(i.down)}${short(i.expiry)}</tr>`).join('')}</tbody></table></div>
    <div style="height:20px"></div>`;
}
showStock.seq = 0;

function closeStock() { openStock = null; $('drawer').hidden = true; }

document.addEventListener('click', e => {
  const t = e.target;
  const hit = sel => t.closest(sel);
  if (t.id === 'drawerClose') return closeStock();
  let n;
  if ((n = hit('[data-tab]'))) { tab = n.dataset.tab; return draw(); }
  if ((n = hit('[data-vol]'))) { volRank = n.dataset.vol; return draw(); }
  if ((n = hit('[data-seg]'))) return n.disabled ? null : setFilter({ [n.dataset.seg]: n.dataset.value });
  if ((n = hit('td[data-set]'))) return setFilter({ sector: n.dataset.sector, ...JSON.parse(n.dataset.set) });
  if ((n = hit('td[data-sector]'))) return setFilter({ sector: filters.sector === n.dataset.sector ? '' : n.dataset.sector });
  if ((n = hit('[data-stock]'))) return showStock(n.dataset.stock);
  if ((n = hit('[data-weekday]'))) return setFilter({ weekday: filters.weekday === n.dataset.weekday ? '-1' : n.dataset.weekday });
  if ((n = hit('[data-index]'))) return setFilter({ index: n.dataset.index });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeStock(); });
for (const name of ['sector', 'period', 'measure', 'turnover', 'move']) $(name).addEventListener('change', e => setFilter({ [name]: e.target.value }));
$('reset').addEventListener('click', () => { filters = { ...DEFAULTS }; syncControls(); load(); });
$('find').addEventListener('change', e => {
  const v = e.target.value.trim().toUpperCase();
  const match = meta.symbols.find(s => s.code === v || s.code === `${v}.NS` || s.name.toUpperCase() === v);
  if (match) { showStock(match.code); e.target.value = ''; }
});

let polling = null;
function showBuild(b) {
  const box = $('progress');
  box.hidden = !(b.running || b.error);
  box.classList.toggle('err', !!b.error);
  box.textContent = b.error ? `Rebuild failed: ${b.error}` : `Rebuilding: ${b.step}`;
  $('rebuild').disabled = b.running;
}
async function poll() {
  const m = await (await fetch(URLS.meta)).json();
  showBuild(m.build);
  if (m.build.running) return;
  clearInterval(polling); polling = null;
  if (!m.build.error) start(m);
}
$('rebuild').addEventListener('click', async () => {
  const r = await fetch(URLS.build, { method: 'POST', headers: { 'X-CSRFToken': csrf() } });
  const d = await r.json();
  showBuild(d.build);
  if (!polling) polling = setInterval(poll, 3000);
});

function start(m) {
  meta = m;
  if (!m.ready) {
    $('coverage').textContent = 'Not built yet';
    $('progress').hidden = false;
    $('progress').textContent = 'Press Rebuild data once to read the stored candles. It takes several minutes.';
    return;
  }
  $('coverage').textContent = `${m.stocks} stocks, ${m.days} sessions to ${fmtDate(m.last)}`;
  $('main').hidden = false;
  $('symbols').innerHTML = m.symbols.map(s => `<option value="${esc(s.code.replace(/\.NS$/, ''))}">${esc(s.name)}</option>`).join('');
  $('sector').innerHTML = '<option value="">All sectors</option>' + m.sectors.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  syncControls();
  load();
}

(async () => {
  const m = await (await fetch(URLS.meta)).json();
  showBuild(m.build);
  if (m.build.running) polling = setInterval(poll, 3000);
  start(m);
})();
</script>
</body>
</html>
