{% extends 'market/base.html' %}
{% block content %}
<h1>Live Data</h1>
<form method="get">
  <label>Select company:</label>
  <select name="company">
    <option value="">-- select --</option>
    {% for c in companies %}
      <option value="{{ c.code }}" {% if company and c.code == company.code %}selected{% endif %}>{{ c.code }} - {{ c.name }}</option>
    {% endfor %}
  </select>
  <button type="submit">Show</button>
</form>

{% if company %}
  <h2>Live for {{ company }}</h2>
  <p>{{ live.note }}</p>
{% endif %}
{% endblock %}
