{% extends 'market/base.html' %}
{% block content %}

<head>
    <title>Stock Data Manager</title>

    <style>
        .box {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        .box h3 {
            margin-top: 0;
        }

        #progress-container {
            width: 100%;
            background: #ddd;
            margin-top: 20px;
            display: none;
            border-radius: 5px;
        }

        #progress-bar {
            width: 0%;
            height: 25px;
            background: #28a745;
            text-align: center;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            transition: width .4s ease;
            min-width: 2.5em;
        }

        #job-note {
            margin-top: 8px;
            font-size: 13px;
            color: #1e3a8a;
            background: #eef3ff;
            border-radius: 4px;
            padding: 6px 10px;
        }

        #error-log {
            margin-top: 6px;
            font-size: 13px;
            color: #b45309;
        }

        #progress-status {
            margin-top: 8px;
            font-size: 14px;
            color: #555;
        }

        .danger {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>

    <script>
        /* =======================
           START PROCESSING
        ======================== */

        // The server starts the fetch in the background and answers at once with a
        // task_id; this page then polls the task's progress every second.
        const FETCH_URLS = {
            daily: "{% url 'market:fetch_daily_data' %}",
            "5min": "{% url 'market:fetch_five_minute_data' %}",
        };
        const PROGRESS_URL = "{% url 'market:fetch_progress' 'TASK_ID' %}";
        let pollTimer = null;

        function startProcessing() {
            const interval = document.getElementById("interval").value;
            setRunning(true);
            document.getElementById("progress-container").style.display = "block";
            updateBar(0);
            showErrorLog(null);
            toastStatus("");
            setStatus("Starting…");

            fetch(FETCH_URLS[interval], {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}"
                }
            })
            .then(res => {
                if (!res.ok) throw new Error("Server returned " + res.status);
                return res.json();
            })
            .then(data => {
                if (data.already_running) {
                    // Only one fetch runs at a time (yfinance can't be called in parallel)
                    const label = { daily: "Daily", "5min": "5 Minute" }[data.running_kind] || "A";
                    const msg = data.running_kind === interval
                        ? `${label} fetch is already running - showing its progress.`
                        : `${label} fetch is still running - only one fetch can run at a time. Showing its progress; start ${interval === "daily" ? "Daily" : "5 Minute"} when it finishes.`;
                    toastStatus(msg);
                }
                pollProgress(data.task_id);
            })
            .catch(err => {
                setRunning(false);
                setStatus("Could not start: " + err.message, true);
            });
        }

        function pollProgress(taskId) {
            clearInterval(pollTimer);
            const tick = () => {
                fetch(PROGRESS_URL.replace("TASK_ID", taskId))
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "not_found") {
                            clearInterval(pollTimer);
                            setRunning(false);
                            setStatus("Lost track of this task (was the server restarted?).", true);
                            return;
                        }
                        const total = data.total || 0;
                        const done = data.done || 0;
                        const percent = total ? Math.floor((done / total) * 100) : 0;
                        const errors = (data.errors ? ` · ${data.errors} error${data.errors === 1 ? "" : "s"}` : "") +
                            (data.no_data ? ` · ${data.no_data} with no data from Yahoo` : "");
                        showErrorLog(data.error_log);

                        if (data.status === "completed") {
                            clearInterval(pollTimer);
                            setRunning(false);
                            updateBar(100);
                            setStatus(`Completed: ${total} companies checked · ${data.rows} rows inserted${errors}.`);
                        } else if (data.status === "failed") {
                            clearInterval(pollTimer);
                            setRunning(false);
                            setStatus(`Failed after ${done} of ${total} companies: ${data.error || "unknown error"}`, true);
                        } else {
                            updateBar(percent);
                            setStatus(total
                                ? `${done} of ${total} companies` + (data.current ? ` · now: ${data.current}` : "") +
                                  ` · ${data.rows} rows inserted${errors}`
                                : "Preparing…");
                        }
                    })
                    .catch(() => setStatus("Waiting for the server…"));
            };
            tick();
            pollTimer = setInterval(tick, 1000);
        }

        function updateBar(percent) {
            const bar = document.getElementById("progress-bar");
            bar.style.width = percent + "%";
            bar.innerText = percent + "%";
        }

        // Symbols that failed (or Yahoo had no data for) are written to a log file on the server.
        const ERROR_LOG_URL = "{% url 'market:fetch_error_log' 'LOG_NAME' %}";
        function showErrorLog(name) {
            const el = document.getElementById("error-log");
            if (!name) { el.hidden = true; return; }
            const url = ERROR_LOG_URL.replace("LOG_NAME", encodeURIComponent(name));
            el.hidden = false;
            el.innerHTML = `Symbol problems are logged in <code>logs/fetch_errors/${name}</code> - ` +
                `<a href="${url}" target="_blank">view</a> · <a href="${url}?download=1">download</a>`;
        }

        // A message that stays put while the status line updates every second.
        function toastStatus(text) {
            const el = document.getElementById("job-note");
            el.textContent = text || "";
            el.hidden = !text;
        }

        function setStatus(text, isError) {
            const el = document.getElementById("progress-status");
            el.textContent = text;
            el.style.color = isError ? "#dc3545" : "#555";
        }

        function setRunning(running) {
            const btn = document.getElementById("start-btn");
            btn.disabled = running;
            btn.textContent = running ? "Processing…" : "Start Processing";
            document.getElementById("interval").disabled = running;
        }

        /* =======================
           DELETE DATA
        ======================== */

        function deleteData() {
            const date = document.getElementById("delete-date").value;
            const interval = document.getElementById("delete-interval").value;

            if (!date) {
                alert("Please select a date");
                return;
            }

            if (!confirm(`Delete ${interval} data for ${date}?`)) {
                return;
            }

            fetch("{% url 'market:delete_data' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: new URLSearchParams({
                    date: date,
                    interval: interval
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    alert(`Deleted ${data.deleted_rows} rows`);
                } else {
                    alert(data.error || "Delete failed");
                }
            })
            .catch(() => alert("Server error"));
        }
    </script>
</head>

<body>

<!-- ================= START PROCESSING BOX ================= -->
<div class="box">
    <h3>📈 Start Processing</h3>

    <label>Select Time Frame:</label>
    <select id="interval">
        <option value="daily">Daily</option>
        <option value="5min">5 Minute</option>
    </select>

    <button id="start-btn" onclick="startProcessing()">Start Processing</button>

    <div id="progress-container">
        <div id="progress-bar">0%</div>
    </div>
    <div id="job-note" hidden></div>
    <div id="progress-status"></div>
    <div id="error-log" hidden></div>
</div>

<!-- ================= DELETE DATA BOX ================= -->
<div class="box">
    <h3>🗑️ Delete Data</h3>

    <label>Select Time Frame:</label>
    <select id="delete-interval">
        <option value="daily">Daily</option>
        <option value="5min">5 Minute</option>
    </select>

    <label>Select Date:</label>
    <input type="date" id="delete-date">

    <button class="danger" onclick="deleteData()">Delete Data</button>
</div>

</body>
{% endblock %}
